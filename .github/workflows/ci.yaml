name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned to Go 1.25.x because golangci-lint v2.5.0 ships a go/types built
# with Go 1.25 and panics when the toolchain (and therefore the stdlib)
# is Go 1.26+. Bump back to "stable" once a golangci-lint release built
# with Go 1.26 is available.
env:
  GO_VERSION: "1.25.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Cross-compile all release targets
        run: |
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              echo "=> $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w" \
                  -o /tmp/kafko_${os}_${arch}${ext} ./cmd/kafko
            done
          done
          /tmp/kafko_linux_amd64 version
