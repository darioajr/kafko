version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # stdout/stderr writes are intentionally unchecked — the tabwriter Flush
      # at the end of each command surfaces the only error we can act on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
