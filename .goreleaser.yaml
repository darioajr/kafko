version: 2

project_name: kafko

before:
  hooks:
    - go mod tidy

builds:
  - id: kafko
    main: ./cmd/kafko
    binary: kafko
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/darioajr/kafko/internal/cli.Version={{ .Version }}
      - -X github.com/darioajr/kafko/internal/cli.Commit={{ .Commit }}
      - -X github.com/darioajr/kafko/internal/cli.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

upx:
  - enabled: true
    ids: [kafko]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    compress: best
    lzma: true

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

nfpms:
  - id: kafko
    package_name: kafko
    ids: [kafko]
    vendor: Dario Alves Junior
    homepage: https://github.com/darioajr/kafko
    maintainer: Dario Alves Junior <darioajr@gmail.com>
    description: Modern Kafka CLI
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/kafko/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/kafko/README.md
    rpm:
      group: Applications/System
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-deb-package

brews:
  - name: kafko
    ids: [default]
    repository:
      owner: darioajr
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/darioajr/kafko
    description: Modern Kafka CLI — speak Kafka from your terminal
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew formula update for {{ .ProjectName }} {{ .Tag }}"
    test: |
      system "#{bin}/kafko", "version"
    install: |
      bin.install "kafko"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999

# Single buildx-driven multi-arch image, pushed to all three registries.
# Replaces the legacy `dockers` + `docker_manifests` pair (deprecated since
# goreleaser v2.x). SBOM is generated automatically (sbom: true is the
# default). The Dockerfile uses ${TARGETPLATFORM}/kafko so buildx picks
# the right binary per platform.
dockers_v2:
  - id: kafko
    dockerfile: Dockerfile
    ids: [kafko]
    images:
      - ghcr.io/darioajr/kafko
      - docker.io/darioajr/kafko
      - quay.io/darioajr/kafko
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: kafko
      org.opencontainers.image.description: Modern Kafka CLI
      org.opencontainers.image.source: https://github.com/darioajr/kafko
      org.opencontainers.image.url: https://github.com/darioajr/kafko
      org.opencontainers.image.documentation: https://github.com/darioajr/kafko#readme
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

release:
  github:
    owner: darioajr
    name: kafko
  draft: false
  prerelease: auto
