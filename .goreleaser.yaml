version: 2

project_name: kafko

before:
  hooks:
    - go mod tidy

builds:
  - id: kafko
    main: ./cmd/kafko
    binary: kafko
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/darioajr/kafko/internal/cli.Version={{ .Version }}
      - -X github.com/darioajr/kafko/internal/cli.Commit={{ .Commit }}
      - -X github.com/darioajr/kafko/internal/cli.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999

# Each docker entry builds one platform-specific image and pushes the same
# tarball to ghcr.io, Docker Hub and Quay. Manifests below stitch amd64+arm64
# into multi-arch refs (`:latest`, `:vX.Y.Z`) on each registry.
dockers:
  - id: kafko-amd64
    use: buildx
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/darioajr/kafko:{{ .Version }}-amd64"
      - "ghcr.io/darioajr/kafko:latest-amd64"
      - "docker.io/darioajr/kafko:{{ .Version }}-amd64"
      - "docker.io/darioajr/kafko:latest-amd64"
      - "quay.io/darioajr/kafko:{{ .Version }}-amd64"
      - "quay.io/darioajr/kafko:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--label=org.opencontainers.image.title=kafko"
      - "--label=org.opencontainers.image.description=Modern Kafka CLI"
      - "--label=org.opencontainers.image.source=https://github.com/darioajr/kafko"
      - "--label=org.opencontainers.image.url=https://github.com/darioajr/kafko"
      - "--label=org.opencontainers.image.documentation=https://github.com/darioajr/kafko#readme"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: kafko-arm64
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/darioajr/kafko:{{ .Version }}-arm64"
      - "ghcr.io/darioajr/kafko:latest-arm64"
      - "docker.io/darioajr/kafko:{{ .Version }}-arm64"
      - "docker.io/darioajr/kafko:latest-arm64"
      - "quay.io/darioajr/kafko:{{ .Version }}-arm64"
      - "quay.io/darioajr/kafko:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--label=org.opencontainers.image.title=kafko"
      - "--label=org.opencontainers.image.description=Modern Kafka CLI"
      - "--label=org.opencontainers.image.source=https://github.com/darioajr/kafko"
      - "--label=org.opencontainers.image.url=https://github.com/darioajr/kafko"
      - "--label=org.opencontainers.image.documentation=https://github.com/darioajr/kafko#readme"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  # GHCR
  - name_template: "ghcr.io/darioajr/kafko:{{ .Version }}"
    image_templates:
      - "ghcr.io/darioajr/kafko:{{ .Version }}-amd64"
      - "ghcr.io/darioajr/kafko:{{ .Version }}-arm64"
  - name_template: "ghcr.io/darioajr/kafko:latest"
    image_templates:
      - "ghcr.io/darioajr/kafko:latest-amd64"
      - "ghcr.io/darioajr/kafko:latest-arm64"

  # Docker Hub
  - name_template: "docker.io/darioajr/kafko:{{ .Version }}"
    image_templates:
      - "docker.io/darioajr/kafko:{{ .Version }}-amd64"
      - "docker.io/darioajr/kafko:{{ .Version }}-arm64"
  - name_template: "docker.io/darioajr/kafko:latest"
    image_templates:
      - "docker.io/darioajr/kafko:latest-amd64"
      - "docker.io/darioajr/kafko:latest-arm64"

  # Quay
  - name_template: "quay.io/darioajr/kafko:{{ .Version }}"
    image_templates:
      - "quay.io/darioajr/kafko:{{ .Version }}-amd64"
      - "quay.io/darioajr/kafko:{{ .Version }}-arm64"
  - name_template: "quay.io/darioajr/kafko:latest"
    image_templates:
      - "quay.io/darioajr/kafko:latest-amd64"
      - "quay.io/darioajr/kafko:latest-arm64"

release:
  github:
    owner: darioajr
    name: kafko
  draft: false
  prerelease: auto
